name: Tutor

permissions:
  contents: read

on:
  pull_request:
    types: [synchronize, opened]

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Tuteur
        run: python main.py
